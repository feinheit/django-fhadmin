[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-fhadmin"
description = "Modifies the stock Django-Administration interface to fit our ideas a little bit better."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [
  { name = "Matthias Kestenholz", email = "mk@feinheit.ch" },
]
requires-python = ">=3.12"
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "django>=5.2",
]
optional-dependencies.tests = [
  "django-content-editor",
  "django-prose-editor",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-playwright",
]
urls.Homepage = "http://github.com/feinheit/django-fhadmin/"

[tool.hatch]
version.path = "fhadmin/__init__.py"
build.targets.wheel.packages = [ "fhadmin" ]

[tool.pytest]
ini_options.testpaths = [ "tests/testapp" ]
ini_options.pythonpath = [ "tests" ]
ini_options.DJANGO_SETTINGS_MODULE = "testapp.settings"

[tool.coverage]
run.branch = true
run.include = [
  "*fhadmin*",
  "*testapp*",
]
run.omit = [
  "*.tox*",
  "*migrations*",
]
