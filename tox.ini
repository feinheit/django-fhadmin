[tox]
envlist =
    py{312,313,314}-dj{52,60,61}
    py{314}-djmain

[testenv]
usedevelop = true
extras = tests
setenv =
    DJANGO_ALLOW_ASYNC_UNSAFE = true
passenv =
    HOME
    DISPLAY
    XAUTHORITY
commands =
    playwright install chromium
    pytest --cov=fhadmin --cov-report=term-missing --browser chromium {posargs}
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
